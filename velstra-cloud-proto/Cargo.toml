[package]
name = "velstra-cloud-proto"
version = "0.1.0"
description = "The wire contract: protobuf messages and services, and their conversions to the model"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
velstra-cloud-model = { workspace = true }
prost = { workspace = true }
# For `google.protobuf.FieldMask`, which every update request carries. The
# well-known types are compiled into this crate by prost-build unless they are
# taken from here, and taking them from here is what makes a mask this crate
# builds the same type as one a generated client builds.
prost-types = { workspace = true }
tonic = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
