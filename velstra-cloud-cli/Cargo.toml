[package]
name = "velstra-cloud-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The command line for a Velstra cell."

[[bin]]
name = "velstra"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
velstra-cloud-console = { path = "../velstra-cloud-console" }
