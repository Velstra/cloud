[package]
name = "velstra-cloud-e2e"
version = "0.1.0"
description = "The layers, run together — the only place that proves they agree"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "velstra-cloud-dev"
path = "src/main.rs"

[dependencies]
velstra-cloud-api = { path = "../velstra-cloud-api" }
velstra-cloud-console = { path = "../velstra-cloud-console" }
velstra-cloud-controller = { path = "../velstra-cloud-controller" }
velstra-cloud-model = { workspace = true }
velstra-cloud-nodeagent = { path = "../velstra-cloud-nodeagent" }
velstra-cloud-store = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
velstra-cloud-api = { path = "../velstra-cloud-api" }
velstra-cloud-console = { path = "../velstra-cloud-console" }
velstra-cloud-controller = { path = "../velstra-cloud-controller" }
velstra-cloud-model = { workspace = true }
velstra-cloud-nodeagent = { path = "../velstra-cloud-nodeagent" }
velstra-cloud-store = { workspace = true }

axum = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = { workspace = true }
tokio = { workspace = true }
