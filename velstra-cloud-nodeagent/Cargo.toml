[package]
name = "velstra-cloud-nodeagent"
version = "0.1.0"
description = "The agent on a hypervisor: one stream to the cell, actions on itself, status back"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# Images live on https. The digest is what makes the *bytes* trustworthy — a
# wrong byte gives a wrong digest and the fetch fails — but refusing https meant
# refusing every place a cloud image is actually published, and an operator was
# told to go and find an http mirror of Debian.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# For the agent's own line to the API, which serves TLS now. Not reqwest,
# because the watch is a long-lived chunked GET this client streams by hand —
# the TCP stream is simply wrapped. The root of trust is the cell's certificate,
# pinned from a file, never "accept anything".
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
futures-util = "0.3"
velstra-cloud-fabric = { workspace = true }
velstra-cloud-model = { workspace = true }
velstra-cloud-store = { workspace = true }
velstra-cloud-wire = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true }
# Only the write-through-API test needs a real API to talk to; the agent crate
# itself does not depend on the API, and this keeps that true for everything but
# the one integration test that proves `--api` mode reports through it.
velstra-cloud-api = { path = "../velstra-cloud-api" }
