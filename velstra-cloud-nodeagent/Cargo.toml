[package]
name = "velstra-cloud-nodeagent"
version = "0.1.0"
description = "The agent on a hypervisor: one stream to the cell, actions on itself, status back"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
velstra-cloud-fabric = { workspace = true }
velstra-cloud-model = { workspace = true }
velstra-cloud-store = { workspace = true }
velstra-cloud-wire = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true }
# Only the write-through-API test needs a real API to talk to; the agent crate
# itself does not depend on the API, and this keeps that true for everything but
# the one integration test that proves `--api` mode reports through it.
velstra-cloud-api = { path = "../velstra-cloud-api" }
