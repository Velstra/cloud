name: CI

# Five lanes, split by what each one needs from the machine:
#
#   check    — the workspace: format, lints, and every test that only needs a
#              CPU and an etcd. Runs on every push and every pull request.
#   console  — the browser suite. Also every push and pull request: it takes
#              about a minute and it is the only thing that catches a console
#              that loads, parses, renders, and then does nothing.
#   guests   — the two tests that start a real virtual machine. Needs /dev/kvm,
#              QEMU, Cloud Hypervisor and a guest image, so it is the one lane
#              with fixtures to install. It still runs per pull request rather
#              than nightly, because the change most likely to break it is a
#              change to the node agent, and the run itself is seconds once the
#              fixtures are cached.
#
#   nix-sandbox — the flake's checks that need nothing but a CPU: the Debian
#              package and its unit assertions, the setup wizard driven answer
#              by answer, the console page, the dev smoke test. Minutes, so it
#              runs on every push and pull request.
#   nix-vm   — the flake's checks that boot a NixOS machine, one job each.
#              Nightly and on demand: each builds a system closure and boots it,
#              which on a two-vCPU hosted runner is tens of minutes even warm.
#
# The nightly schedule re-runs the first three unchanged. Nothing here is nightly-only:
# it exists to catch what moves underneath us — a new nightly rustfmt, a mirror
# that stopped serving an image, a hosted runner that lost KVM — on a day when
# nobody is waiting on a merge.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 05:00, an hour clear of the other three repositories' nightlies (wren 02,
    # sentinel 03, fabric 04): concurrent jobs are capped per account, not per
    # repository, and sentinel's nightly alone asks for twelve of them.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; no job here writes anything back to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # `rustfmt.toml` sets `group_imports` and `imports_granularity`, which are
      # nightly-only. Stable rustfmt does not fail on them — it prints
      # "unstable features are only available in nightly" and formats without
      # them, so a stable `cargo fmt --check` is a gate that passes whatever the
      # imports look like. Hence a nightly toolchain, used for `fmt` and nothing
      # else. It is the rolling nightly, so if one day rustfmt changes its mind
      # about imports and this goes red on an unrelated pull request, pin
      # `dtolnay/rust-toolchain@master` with `toolchain: nightly-YYYY-MM-DD`
      # here — do not reformat the tree to satisfy a moving target.
      - name: Install Rust (nightly, for rustfmt only)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `velstra-cloud-proto` compiles the `.proto` with prost, which shells out
      # to `protoc`. Without it the build fails in the build script with
      # "Could not find `protoc`".
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # `velstra-cloud-store/tests/etcd.rs` starts its own single-node etcd per
      # case. Without the binary those cases fail rather than skip (deliberately:
      # `VELSTRA_ETCD_OPTIONAL=1` is the only way to accept the gap, and CI is
      # exactly where the gap must not be accepted). So install it, and do NOT
      # set that variable anywhere in this file.
      - name: Install etcd
        run: |
          set -euo pipefail
          version=v3.6.14
          curl -fsSL "https://github.com/etcd-io/etcd/releases/download/${version}/etcd-${version}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 \
                "etcd-${version}-linux-amd64/etcd" "etcd-${version}-linux-amd64/etcdctl"
          etcd --version

      - name: rustfmt
        run: cargo +nightly fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Cross-repo and cross-document drift, run as a named gate so a broken
      # contract is legible in the log rather than buried in the workspace run.
      # `--nocapture` is deliberate: the fabric byte-for-byte check skips when the
      # fabric repository is not checked out beside this one — which it is not
      # here — and the skip must be *visible* rather than passing for a silent
      # green. The digest check and the route-in-contract checks are hard gates
      # and run regardless.
      #
      #   - fabric_proto:    the vendored data-plane proto matches its recorded
      #                      sha256, and fabric's own copy when both repos are
      #                      colocated (skips loudly otherwise).
      #   - contract_routes: every collection, route and verb the API serves is
      #                      named in docs/rest-contract.md.
      #   - openapi:         docs/openapi.json is byte-for-byte what the API
      #                      generates, and every verb the router dispatches is
      #                      in it. Regenerate with
      #                      VELSTRA_WRITE_OPENAPI=1 cargo test -p velstra-cloud-api --test openapi
      - name: contract drift
        run: |
          cargo test -p velstra-cloud-fabric --test fabric_proto --locked -- --nocapture
          cargo test -p velstra-cloud-api --test contract_routes --locked
          cargo test -p velstra-cloud-api --test openapi --locked

      # `--locked` on purpose: a Cargo.lock that no longer matches the manifests
      # is a change nobody made on purpose, and it is better found here than in
      # a release build.
      #
      # The fabric controller, built beside this checkout.
      #
      # `tests/fabric_datapath.rs` deliberately goes red when it is missing:
      # the SRv6 end-to-end case is the one thing here with no unit fallback —
      # the config served back, with its derived service SIDs, is fabric's own
      # logic and only reachable over gRPC — so a run without it would skip that
      # case and go green, which looks exactly like a run that proved SRv6
      # works. The test offers VELSTRA_FABRIC_OPTIONAL=1 to accept that gap on
      # purpose. This builds it instead, because accepting the gap in the one
      # place that could close it is not accepting a gap, it is hiding one.
      #
      # Cloned rather than checked out with the action: the test looks for
      # `<repo>/../fabric`, and actions/checkout cannot write outside the
      # workspace. Shallow, and only the one binary — the eBPF crate needs a
      # nightly toolchain and bpf-linker, and none of that is wanted here.
      #
      # The cost is honest and worth naming: cloud's CI now goes red if fabric's
      # main does not build. That is information rather than noise — the two are
      # a client and a server of one contract, and a fabric that does not build
      # is a fabric this cannot talk to either.
      - name: Build the fabric controller, so SRv6 is really exercised
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Velstra/fabric.git \
            "$GITHUB_WORKSPACE/../fabric"
          cargo build -p velstra-controller \
            --manifest-path "$GITHUB_WORKSPACE/../fabric/Cargo.toml"
          test -x "$GITHUB_WORKSPACE/../fabric/target/debug/velstra-controller"

      # This runs the two guest-boot tests too, and they will skip — the runner
      # has no QEMU here. That is what the `guests` job below is for; it installs
      # the fixtures and fails if they skip there.
      - name: test
        run: cargo test --workspace --locked

  console:
    name: browser suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `run.sh` builds the page with cargo. Only the console crate is built,
      # which does not need protoc today — installed anyway so that the day a
      # console dependency reaches the proto crate, this job fails on the
      # console and not on its toolchain.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # The harness drives Chrome over the DevTools protocol and takes the
      # binary from $CHROMIUM. The hosted image ships both Chromium and Google
      # Chrome; resolve whichever is there rather than assuming a name.
      - name: Locate a browser
        run: |
          set -euo pipefail
          for candidate in chromium chromium-browser google-chrome google-chrome-stable; do
            if command -v "$candidate" >/dev/null; then
              echo "CHROMIUM=$(command -v "$candidate")" >> "$GITHUB_ENV"
              "$candidate" --version
              exit 0
            fi
          done
          echo "::error::no Chromium or Chrome on this runner — the console suite cannot run."
          exit 1

      # No setup-node: the harness is one file using only built-in APIs, and it
      # passes on the Node the hosted image already ships (22.x, verified).
      - name: Drive the console in a real browser
        run: velstra-cloud-console/tests/console/run.sh

  guests:
    name: a guest really boots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # /dev/kvm exists on hosted x86 Linux runners (GitHub enabled hardware
      # acceleration on the 2-vCPU images in April 2024), but it is root:kvm
      # 0660 and the `runner` user is not in that group, so a job that does not
      # do this finds a device it cannot open. GitHub documents nested
      # virtualization as unsupported-but-present: if a future image drops it,
      # this job goes red rather than quietly falling back to software
      # emulation, and the answer is then a self-hosted runner.
      - name: Let this user open /dev/kvm
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # `trigger` queues the event and returns; `settle` waits for the queue
          # to drain. Without it the check below races the rule it just
          # installed — and that race is not theoretical: it lost once, printed
          # "this user cannot open it", and the `ls` on the very next line
          # showed crw-rw-rw-, which is the rule having taken a moment later.
          sudo udevadm settle --timeout=30 || true
          # Belt and braces, because settle waits for udev and not for the node
          # to have been relabelled by the time this shell looks at it.
          for _ in $(seq 20); do [ -w /dev/kvm ] && break; sleep 0.5; done
          # Absent and unwritable are different problems and want different
          # answers, and saying "not writable" for a device that is not there
          # sends somebody to read about permissions for an hour.
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm does not exist on this runner. Nested virtualisation is \
          documented by GitHub as unsupported-but-present, so it comes and goes with the image: \
          it worked on this repository earlier the same day it first failed. Re-running may land \
          on a runner that has it. If it stops coming back, the answer is a self-hosted runner, \
          not software emulation — a test that silently passes under TCG is worse than one that \
          does not run."
            exit 1
          fi
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm exists but this user cannot open it — the udev rule above \
          did not take. That is a fixable problem, unlike the one above."
            ls -l /dev/kvm
            exit 1
          fi
          ls -l /dev/kvm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler qemu-system-x86 qemu-utils

      - name: Install Cloud Hypervisor
        run: |
          set -euo pipefail
          version=v53.0
          sudo curl -fsSL -o /usr/local/bin/cloud-hypervisor \
            "https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/${version}/cloud-hypervisor-static"
          sudo chmod +x /usr/local/bin/cloud-hypervisor
          cloud-hypervisor --version

      # Two different guests, because the two backends do not accept the same
      # one — which is the finding the Cloud Hypervisor test exists to record.
      # QEMU boots a stock BIOS cloud image through its own firmware; Cloud
      # Hypervisor has no firmware and takes a kernel and an initramfs directly.
      # Both are pinned, and cached so the mirror is asked once per pin.
      - name: Cache the guest fixtures
        id: fixtures
        uses: actions/cache@v6
        with:
          path: /tmp/vq
          key: guest-fixtures-alpine-3.21.7-netboot-3.21

      - name: Fetch the guest fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/vq/boot
          base=https://dl-cdn.alpinelinux.org/alpine/v3.21/releases
          # A BIOS-partitioned image on purpose: QEMU's SeaBIOS boots it, and the
          # UEFI variant would not be booting the same path the platform ships.
          curl -fsSL -o /tmp/vq/alpine.qcow2 \
            "$base/cloud/nocloud_alpine-3.21.7-x86_64-bios-cloudinit-r0.qcow2"
          qemu-img convert -f qcow2 -O raw /tmp/vq/alpine.qcow2 /tmp/vq/alpine.raw
          rm -f /tmp/vq/alpine.qcow2
          curl -fsSL -o /tmp/vq/boot/vmlinuz-virt "$base/x86_64/netboot/vmlinuz-virt"
          curl -fsSL -o /tmp/vq/boot/initramfs-virt "$base/x86_64/netboot/initramfs-virt"
          ls -l /tmp/vq /tmp/vq/boot

      # Both backends start their guests with `systemd-run --user`, which needs
      # a user manager and a session bus. A hosted runner has systemd but no
      # login session for `runner`, so linger is what brings user@UID up.
      - name: Give this user a systemd manager
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          runtime="/run/user/$(id -u)"
          # `[ -d … ] && break` would end the step rather than the loop: an
          # && list whose left side fails is still a failing command, and this
          # script runs under `set -e`.
          for _ in $(seq 30); do
            if [ -d "$runtime" ]; then break; fi
            sleep 1
          done
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus" \
            systemd-run --user --scope true
          echo "systemd-run --user works"

      # Both tests skip themselves when the machine cannot run them, which is
      # right on a laptop and worthless here: a lane that installed QEMU, Cloud
      # Hypervisor, KVM and two guest images and then skipped is a green tick
      # that proves nothing. So the output is kept and read, and any "skipping:"
      # in it fails the job with the reason the test printed.
      - name: Boot a guest under each backend
        run: |
          set -euo pipefail
          cargo test -p velstra-cloud-nodeagent --locked \
            --test qemu_boots_a_guest \
            --test cloud_hypervisor_boots_a_guest \
            -- --nocapture 2>&1 | tee /tmp/guests.log
          if grep -q '^skipping:' /tmp/guests.log; then
            echo "::error::a guest-boot test skipped instead of running:"
            grep '^skipping:' /tmp/guests.log
            exit 1
          fi
          # Belt and braces: cargo reports "ok" for a test that returned early,
          # so count the ones that actually reported.
          booted=$(grep -c '^test .* \.\.\. ok$' /tmp/guests.log || true)
          if [ "$booted" -lt 2 ]; then
            echo "::error::expected two guests to boot, saw $booted"
            exit 1
          fi
          echo "$booted guests booted."

  # The Nix checks, split by what they cost.
  #
  # None of these had ever run on a runner, and the reason was one line: the
  # `sentinel` input pointed at `git+file:///home/…`, so the flake could not be
  # evaluated by anybody but its author. That is fixed at the source — it points
  # at the public repository now, and a developer working on both at once passes
  # `--override-input sentinel path:../sentinel` for the length of one command.
  #
  # Two jobs, because the two halves are not comparable. `nix-sandbox` builds
  # what needs nothing but a CPU: the Debian package and its unit assertions, the
  # setup wizard driven answer by answer, the console page, the dev smoke test.
  # A few minutes, so it runs on every pull request. `nix-vm` boots real virtual
  # machines — a NixOS system per check — and is the expensive half.
  nix-sandbox:
    name: nix — sandbox checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      # Keeps the Rust build and the nixpkgs closure between runs. Without it
      # every job rebuilds the workspace from source under Nix, which is the
      # same work the `check` job above already did with a warm cargo cache.
      - uses: DeterminateSystems/magic-nix-cache-action@v13

      # There is deliberately no `nix flake check --no-build` step here, and the
      # reason is worth writing down because it looked like an obvious win.
      #
      # The Rust toolchain input uses import-from-derivation: it reads a channel
      # manifest with `builtins.readFile`, which means the manifest has to be
      # *built* before evaluation can finish. `--no-build` refuses to build it,
      # so the whole evaluation dies with "path … .drv is not valid" — and it
      # dies on a developer machine only if their store happens not to have the
      # manifest already, which mine did. It passed locally and failed on the
      # first runner that ever tried it.
      #
      # The step below covers what that one was supposed to: it evaluates the
      # checks attrset (names only, which needs no IFD) before anything is
      # built, so a module that does not evaluate fails in seconds.

      # Every check the flake exposes is named by one of the two lanes.
      #
      # Without this, adding a thirteenth check runs it nowhere — and nothing
      # says so, because a lane that lists eight names and runs eight names is
      # green. That is the same silence this repository keeps finding in its own
      # features, and the workflow is not exempt from it.
      - name: No check runs nowhere
        run: |
          set -euo pipefail
          exposed=$(nix eval --raw --impure --expr \
            'builtins.concatStringsSep "\n" (builtins.attrNames (builtins.getFlake (toString ./.)).checks.x86_64-linux)')
          missing=
          for check in $exposed; do
            # Matched as a whole word: `guest` must not be satisfied by
            # `guests`, which is a different lane entirely.
            grep -qE "(^|[^a-z-])$check([^a-z-]|$)" .github/workflows/ci.yml || missing="$missing $check"
          done
          if [ -n "$missing" ]; then
            echo "::error::these flake checks are run by no lane:$missing"
            exit 1
          fi
          echo "$(echo "$exposed" | wc -l) checks, all named by a lane."

      - name: Sandbox checks
        run: |
          set -euo pipefail
          for check in deb setup console dev-smoke; do
            echo "::group::$check"
            nix build ".#checks.x86_64-linux.$check" --no-link -L
            echo "::endgroup::"
          done

  # The virtual-machine checks: a NixOS system per check, booted for real.
  #
  # Nightly and on demand rather than per pull request, and the reason is
  # honest rather than principled — each of these builds a system closure and
  # boots it, and on a two-vCPU hosted runner that is tens of minutes even with
  # the cache warm. The cheap half above runs on every change; this half runs
  # every night, which is where a mirror that stopped serving an image or a
  # runner that lost KVM shows up.
  #
  # `workflow_dispatch` is deliberate: the moment to run this by hand is a
  # change to a NixOS module, and that is a judgement the author can make.
  #
  # If this ever needs to be per-pull-request, the answer is a self-hosted
  # runner with a persistent store, not trimming the list.
  nix-vm:
    name: nix — virtual machines
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      # One failing check must not hide the others: these are independent
      # machines and knowing that three of seven broke is worth more than
      # knowing that one did.
      fail-fast: false
      matrix:
        check:
          - single-node
          - register
          - guest
          - storage
          - maintenance
          - fabric-agent
          - wizard
          - node-image-boots
    steps:
      - uses: actions/checkout@v7

      # Same rule as the `guests` job: /dev/kvm is present on hosted x86 Linux
      # runners but not writable by this user, and a nixosTest without it falls
      # back to software emulation slowly enough to look like a hang.
      - name: Let this user open /dev/kvm
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # `trigger` queues the event and returns; `settle` waits for the queue
          # to drain. Without it the check below races the rule it just
          # installed — and that race is not theoretical: it lost once, printed
          # "this user cannot open it", and the `ls` on the very next line
          # showed crw-rw-rw-, which is the rule having taken a moment later.
          sudo udevadm settle --timeout=30 || true
          # Belt and braces, because settle waits for udev and not for the node
          # to have been relabelled by the time this shell looks at it.
          for _ in $(seq 20); do [ -w /dev/kvm ] && break; sleep 0.5; done
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm does not exist on this runner, so these checks would \
          emulate rather than boot. See the guests job for what that means and what to do."
            exit 1
          fi
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm exists but this user cannot open it — the udev rule did \
          not take."
            ls -l /dev/kvm
            exit 1
          fi

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      - uses: DeterminateSystems/magic-nix-cache-action@v13

      # `--keep-failed` is the point of this step, not a flourish. A nixosTest
      # writes its machines' journals and its screenshots into the build
      # directory, and Nix deletes that directory on failure unless told not to
      # — so without this the artifact upload below would faithfully collect
      # nothing, every time, and look like it was working.
      - name: ${{ matrix.check }}
        run: nix build ".#checks.x86_64-linux.${{ matrix.check }}" --no-link --keep-failed -L

      # What the machines said, which on a failure is the whole diagnosis: the
      # test script's log, each VM's journal, and the screenshot taken when an
      # assertion tripped.
      - name: Keep what the machines said
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-test-${{ matrix.check }}
          path: /tmp/nix-build-*
          retention-days: 7
          if-no-files-found: warn
