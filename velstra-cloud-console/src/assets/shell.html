<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velstra Cloud</title>
<style>/*=CSS=*/</style>
</head>
<body>

<!-- The page itself is public: markup with no data in it, and a sign-in that
     cannot be reached is not a sign-in. Every byte behind it needs the bearer
     token the API requires. -->
<main id="signin">
  <div class="box">
    <h1>Velstra Cloud</h1>
    <p class="prose">Sign in to see this cell.</p>
    <!-- `novalidate`: the username/password fields carry `required` for the
         password path, but a service account signs in with a token alone and
         leaves both blank. Native constraint validation would reject that form
         before the submit handler (app.js) runs and can route to the token,
         killing token-only sign-in. The handler validates whichever path the
         operator actually used. -->
    <form id="tokenform" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <!-- `autocomplete` on both fields and a real `name`: without them a
             password manager cannot offer to fill or to save, and an operator
             who cannot save a password picks one they can remember. -->
        <input id="username" name="username" type="text" autocomplete="username"
               spellcheck="false" autocapitalize="none" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <div><button class="btn primary" type="submit" id="signinbtn">Sign in</button></div>
      <p id="loginerr" class="err hidden"></p>
      <!-- A service account or an automation holds a static token rather than a
           password, and there is no session behind one. Kept, and kept second:
           the common case is a person. -->
      <details class="tokenalt">
        <summary>Use an API token instead</summary>
        <div class="field">
          <label for="token">API token</label>
          <input id="token" type="password" autocomplete="off" spellcheck="false">
        </div>
      </details>
    </form>
  </div>
</main>

<div id="app" class="hidden">
  <header id="top">
    <span id="brand">Velstra <b>Cloud</b></span>
    <!-- No inline sizing: an inline style outranks the stylesheet, so the
         `min-width: 180px` that used to be here made the tenancy switch the
         widest thing in the header whatever the sheet said about it. -->
    <label for="project" class="visually-hidden">Project</label>
    <select id="project"></select>
    <div id="fleet" class="summary"></div>
    <span class="grow"></span>
    <span id="watchstate"></span>
    <!-- Who is signed in, and whether they hold the cell. An operator who
         cannot tell which account they are using is an operator who eventually
         does something as the wrong one. -->
    <span id="whoami" class="who"></span>
    <!-- The way into the jump palette for a hand that reaches for the pointer.
         The keystroke is the fast path; this is the one that teaches it. -->
    <button class="btn jump" id="jump" type="button"
            aria-keyshortcuts="Meta+K Control+K">Jump<kbd>⌘K</kbd></button>
    <button class="btn" id="theme" type="button">Light</button>
    <button class="btn" id="signout" type="button">Sign out</button>
  </header>

  <aside id="rail" aria-label="Collections"></aside>

  <!-- No margin label over the board. The rail already says which group this
       is and the heading says which collection, and a third copy of the same
       word costs the table 208px it needs. The gutter is for a section that
       genuinely has a name and a body — which is the sheet, not this. -->
  <section id="content">
    <h1 id="listtitle"></h1>
    <p class="prose" id="listblurb"></p>
    <div class="sheetacts" id="listacts"></div>
    <!-- Narrowing, on the boards where a cell gets long enough to need it. -->
    <div id="listfilter" class="listfilter hidden"></div>
    <p id="listerr" class="err hidden"></p>
    <!-- The cell's CPU picture, on the nodes board only. Hidden until there is
         something to say, so a cell of identical machines carries no chrome
         for a problem it does not have. -->
    <div id="cpuadvisory" class="cpuadvisory hidden"></div>
    <!-- The cell at a glance. Not a board: nothing here is a row of one
         collection, and the whole point is that it crosses all of them. -->
    <div id="overviewbox" class="overview hidden"></div>
    <!-- The project's network, drawn. Not a board either, and for a sharper
         reason than the overview: what it shows lives in seven collections at
         once, and the thing it is about — how they join up — is in none of
         them. -->
    <div id="topologybox" class="topology hidden"></div>
    <!-- Appears when rows are selected. Above the board rather than floating
         over it: it is about the rows below, and a bar that covers them is a
         bar that hides what is about to be changed. -->
    <div id="picked" class="picked hidden"></div>
    <div class="boardwrap"><table class="board" id="board">
      <thead><tr id="boardhead"></tr></thead>
      <tbody id="boardbody"></tbody>
    </table></div>
    <p id="listempty" class="muted hidden"></p>
  </section>
</div>

<script>
/*=JS=*/
</script>
</body>
</html>
