[workspace]
resolver = "2"
members = [
    "velstra-cloud-api",
    "velstra-cloud-cli",
    "velstra-cloud-console",
    "velstra-cloud-controller",
    "velstra-cloud-e2e",
    "velstra-cloud-fabric",
    "velstra-cloud-model",
    "velstra-cloud-node",
    "velstra-cloud-nodeagent",
    "velstra-cloud-proto",
    "velstra-cloud-store",
    "velstra-cloud-wire",
]

# Same licence as the data plane: the product is AGPL, and a component that
# deviates says so in its own Cargo.toml rather than by omission.
[workspace.package]
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/Velstra/cloud"
homepage = "https://github.com/Velstra/cloud"

[workspace.dependencies]
velstra-cloud-fabric = { path = "velstra-cloud-fabric" }
velstra-cloud-model = { path = "velstra-cloud-model" }
velstra-cloud-proto = { path = "velstra-cloud-proto" }
velstra-cloud-store = { path = "velstra-cloud-store" }
velstra-cloud-wire = { path = "velstra-cloud-wire" }
velstra-cloud-controller = { path = "velstra-cloud-controller" }

anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
# Ed25519 for image signatures. Already in the tree under rustls; naming it here
# adds a verifier, not a dependency.
ring = "0.17"
clap = { version = "4", features = ["derive", "env"] }
etcd-client = "0.19"
futures = "0.3"
# `rustls-tls-webpki-roots` is not enough on its own here: the node a console
# stream goes to presents a certificate signed by the cell's own CA, not by a
# public one. The connector is built by hand from that CA — see
# `velstra-cloud-api/src/console_proxy.rs` — and this feature is what makes
# `connect_async_tls_with_config` exist to hand it to.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
hex = "0.4"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
prost = "0.13"
prost-types = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = "0.12"
tonic-build = "0.12"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
